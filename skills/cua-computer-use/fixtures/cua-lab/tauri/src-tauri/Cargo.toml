[package]
name = "cua-lab"
version = "0.1.0"
description = "Cua Lab Tauri fixture"
edition = "2021"

[lib]
name = "cua_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
