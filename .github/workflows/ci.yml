name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cheap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n wrappers
        run: |
          bash -n skills/cua-computer-use/scripts/cua-use
          bash -n skills/cua-computer-use/scripts/linux-lab
          bash -n skills/cua-computer-use/tests/linux-smoke.sh
          bash -n skills/real-browser/scripts/real_browser.sh
          bash -n skills/svg2icon/scripts/generate_tauri_icons.sh
          bash -n skills/charles-cli/scripts/charles-fast.sh
      - name: xxww-docs unit tests
        run: python3 xxww-docs/scripts/test_docs_tools.py
